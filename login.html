<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - City Pulse</title><link rel="stylesheet" href="style.css">
<style>body{display:flex;align-items:center;justify-content:center;min-height:100vh}.box{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1fr;background:#111625;border:1px solid #2a3246;border-radius:20px;overflow:hidden}.left{background:linear-gradient(135deg,#162040,#1e2a4a);padding:40px;color:#fff}.right{padding:36px;background:#0f1424}.tabs{display:flex;gap:8px;background:#0d1220;padding:4px;border-radius:10px;border:1px solid #2a3246;margin:20px 0}.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#6b7fa3}.tab.active{background:#5a86ff;color:#fff}.inp{margin:12px 0}.inp label{font-size:11px;color:#8aa0c8;display:block;margin-bottom:6px}.inp input{width:100%;padding:12px;border-radius:10px;background:#0d1220;border:1px solid #2a3246;color:#fff;outline:none}.btn{width:100%;padding:13px;border-radius:10px;border:0;background:#2ee66c;color:#000;font-weight:800;cursor:pointer;margin-top:16px}.btn.admin{background:#5a86ff;color:#fff}.err{color:#ff6b6b;font-size:11px;margin-top:8px;display:none;background:#ff4d4d15;border:1px solid #ff4d4d30;padding:8px;border-radius:8px}@media(max-width:700px){.box{grid-template-columns:1fr;margin:16px}}</style>
</head><body>
<div class="box"><div class="left"><div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;"><div style="width:36px;height:36px;background:#2ee66c;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;">◉</div><h2>CITY PULSE</h2></div><h1 style="font-size:28px;line-height:1.2;">Smart Crowd Monitoring</h1><p style="color:#8aa0c8;font-size:13px;margin-top:10px;">Real-time AI + Marketplace model. Camera only for Admin.</p></div>
<div class="right"><h3 style="color:#fff;">Welcome Back</h3><div class="tabs"><div class="tab active" id="pTab" onclick="setRole('public')">👤 Public</div><div class="tab" id="aTab" onclick="setRole('admin')">🔐 Admin</div></div>
<div class="inp"><label>EMAIL</label><input id="email" placeholder="Enter email"></div><div class="inp"><label>PASSWORD</label><input id="pass" type="password" placeholder="Password"></div><div id="err" class="err"></div><button id="loginBtn" class="btn" onclick="login()">Login as Public</button>
<div style="margin-top:16px;padding:10px;background:#0d1220;border:1px dashed #2a3246;border-radius:8px;font-size:11px;color:#5a6f95;">👤 public@citypulse.com / public123<br>🔐 admin@citypulse.com / admin123</div></div></div>
<script>
let role='public';
function setRole(r){role=r;document.getElementById('pTab').classList.toggle('active',r==='public');document.getElementById('aTab').classList.toggle('active',r==='admin');let b=document.getElementById('loginBtn');if(r==='admin'){b.textContent='Login as Admin';b.className='btn admin';email.value='admin@citypulse.com';pass.value='admin123';}else{b.textContent='Login as Public';b.className='btn';email.value='public@citypulse.com';pass.value='public123';}}
function login(){let e=email.value.trim(),p=pass.value.trim();let er=document.getElementById('err');if(role==='public' && (e==='public@citypulse.com'||e==='public') && p==='public123'){localStorage.setItem('isLoggedIn','true');localStorage.setItem('userRole','public');localStorage.setItem('userEmail',e);location.href='public.html';}else if(role==='admin' && (e==='admin@citypulse.com'||e==='admin') && p==='admin123'){localStorage.setItem('isLoggedIn','true');localStorage.setItem('userRole','admin');localStorage.setItem('userEmail',e);localStorage.setItem('isAdmin','true');location.href='admin.html';}else{er.style.display='block';er.textContent='Wrong credentials';}}setRole('public');
</script></body></html>
